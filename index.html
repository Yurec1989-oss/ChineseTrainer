

<!DOCTYPE html>

<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Chinese Trainer</title>

<style>

body {

  margin: 0;

  padding: 20px;

  background: #f1f5f9;

  color: #172033;

  font-family: Arial, sans-serif;

}

header {

  background: #172033;

  color: white;

  padding: 25px;

  border-radius: 15px;

}

.card {

  background: white;

  padding: 20px;

  margin-top: 20px;

  border-radius: 15px;

}

h1 { margin: 0; }

button {

  background: #2563eb;

  color: white;

  border: 0;

  padding: 14px;

  border-radius: 10px;

  font-size: 16px;

  width: 100%;

}

</style>

</head>

<body>

<header>

  <h1>中文 Chinese Trainer</h1>

  <p>Ежедневная практика китайского языка</p>

</header>

<div class="card">

  <h2>Тренировка</h2>

  <p>Переведи на китайский:</p>

  <h3>Отдел качества не получил подтверждение от поставщика.</h3>

  <button onclick="showAnswer()">Показать ответ</button>

  <p id="answer"></p>

</div>

<div class="card">

  <h2>Прогресс</h2>

  <p>Твоя тренировка начинается здесь.</p>

</div>

<script>

function showAnswer() {

  document.getElementById("answer").textContent =

    "质量部门还没有收到供应商的确认。";

}

</script>

</body>

</html>
