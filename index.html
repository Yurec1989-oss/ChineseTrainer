

<!DOCTYPE html>

<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="theme-color" content="#172033">

<title>Chinese Trainer</title>

<style>

*{box-sizing:border-box}

body{margin:0;background:#f1f5f9;color:#172033;font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif}

header{background:#172033;color:white;padding:25px 20px}

header h1{margin:0;font-size:25px}

header p{color:#cbd5e1;margin-bottom:0}

main{max-width:650px;margin:auto;padding:18px}

.card{background:white;border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:0 3px 14px #0000000b}

.label{font-size:13px;color:#64748b}

.task{font-size:21px;line-height:1.5;font-weight:600;margin:18px 0}

textarea{width:100%;min-height:120px;border:1px solid #cbd5e1;border-radius:12px;padding:13px;font-size:17px}

button{border:0;border-radius:11px;padding:13px;font-size:16px;font-weight:600;cursor:pointer}

.primary{background:#2563eb;color:white;width:100%;margin-top:12px}

.secondary{background:#e8eef8;color:#172033}

.answer{display:none;background:#eff6ff;padding:15px;border-radius:12px;margin-top:15px;line-height:1.7}

.buttons{display:flex;gap:10px;margin-top:15px}

.buttons button{flex:1}

.progress{height:8px;background:#e2e8f0;border-radius:8px;overflow:hidden;margin-top:12px}

.bar{height:100%;width:0;background:#2563eb;transition:width .2s}

</style>

</head>

<body>

<header>

<h1>中文 Chinese Trainer</h1>

<p>Ежедневная практика китайского языка</p>

</header>

<main>

<div class="card">

<div style="display:flex;justify-content:space-between">

<strong>Тренировка</strong>

<span class="label" id="counter"></span>

</div>

<div class="progress"><div class="bar" id="bar"></div></div>

<p class="label">Переведи на китайский:</p>

<div class="task" id="question"></div>

<textarea id="userAnswer" placeholder="Напиши свой перевод..."></textarea>

<button class="primary" onclick="showAnswer()">Показать правильный ответ</button>

<div class="answer" id="answer"></div>

<div class="buttons">

<button class="secondary" onclick="previous()">← Назад</button>

<button class="secondary" onclick="next()">Далее →</button>

</div>

</div>

<div class="card">

<strong>Мой прогресс</strong>

<h2 id="progress">0 / 10</h2>

<p class="label">Задания, которые ты отметил как выполненные</p>

<button class="secondary" onclick="markDone()">Отметить выполненным</button>

<button class="secondary" style="margin-top:10px;width:100%" onclick="resetProgress()">Сбросить прогресс</button>

</div>

</main>

<script>

const tasks=[

["Отдел качества не получил подтверждение от поставщика.","质量部门还没有收到供应商的确认。"],

["На складе недостаточно деталей.","仓库里的零件数量不足。"],

["Отсутствие результатов проверки означает, что проектный отдел не может подтвердить готовность производства.","没有检查结果，相当于项目部门无法确认生产是否准备好了。"],

["Недостаток данных не позволяет принять окончательное решение.","数据不足，无法做出最终决定。"],

["Поставщик должен устранить обнаруженные проблемы.","供应商需要解决发现的问题。"],

["Задержка поставки может повлиять на производственный план.","交货延期可能会影响生产计划。"],

["Отдел качества должен повторно проверить все детали.","质量部门需要重新检查所有零件。"],

["Отсутствие необходимых деталей может привести к остановке линии.","缺少必要的零件可能会导致生产线停线。"],

["Проектный отдел должен заранее уведомить производство.","项目部门需要提前通知生产部门。"],

["Мы должны выяснить причину отклонения от плана.","我们需要查明偏离计划的原因。"]

];

let current=0;

let done=JSON.parse(localStorage.getItem("ct_done")||"[]");

let answers=JSON.parse(localStorage.getItem("ct_answers")||"{}");

function save(){

 localStorage.setItem("ct_done",JSON.stringify(done));

 localStorage.setItem("ct_answers",JSON.stringify(answers));

}

function render(){

 document.getElementById("question").textContent=tasks[current][0];

 document.getElementById("counter").textContent=(current+1)+" / "+tasks.length;

 document.getElementById("userAnswer").value=answers[current]||"";

 document.getElementById("answer").style.display="none";

 document.getElementById("answer").textContent="";

 document.getElementById("progress").textContent=done.length+" / "+tasks.length;

 document.getElementById("bar").style.width=(done.length/tasks.length*100)+"%";

}

document.getElementById("userAnswer").addEventListener("input",function(){

 answers[current]=this.value;

 save();

});

function showAnswer(){

 const box=document.getElementById("answer");

 box.innerHTML="<strong>Эталонный перевод:</strong><br>"+tasks[current][1];

 box.style.display="block";

}

function markDone(){

 if(!done.includes(current))done.push(current);

 save();

 render();

}

function next(){

 current=(current+1)%tasks.length;

 render();

}

function previous(){

 current=(current-1+tasks.length)%tasks.length;

 render();

}

function resetProgress(){

 if(confirm("Сбросить весь прогресс и ответы?")){

  done=[];

  answers={};

  save();

  render();

 }

}

render();

</script>

</body>

</html>
